<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Month of Us ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background: linear-gradient(135deg, #ffe3e3, #fbc2eb);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 350px;
            width: 100%;
        }
        h1 {
            font-size: 22px;
            color: #d63031;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #747d8c;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }
        .message-box {
            font-size: 16px;
            color: #4a4a4a;
            line-height: 1.6;
            margin-bottom: 25px;
            background: #fff5f5;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #fca3b7;
            text-align: left;
        }
        button {
            background-color: #fd8fa9;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(253, 143, 169, 0.4);
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Happy 1 Month Anniversary ❤️</h1>
        <p class="subtitle">17.08.2026 • 800 km</p>
        
        <div class="message-box">
            <p>Dear Devansh,</p>
            <p>Thank you for being my safe space...</p>
        </div>
        
        <button onclick="showLove()">Click for a surprise</button>
        <p id="surprise" style="display: none; margin-top: 15px; font-weight: bold; color: #d63031;">I love you to the moon and back! 🌙✨</p>
    </div>

    <script>
        function showLove() {
            var surpriseText = document.getElementById("surprise");
            if (surpriseText.style.display === "none") {
                surpriseText.style.display = "block";
            } else {
                surpriseText.style.display = "none";
            }
        }
    </script>
</body>
</html>
